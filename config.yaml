runtime_policy: native   # native | python

can_device:
  device_type: 33
  device_index: 0
  channel_index: 0
  core_clock_hz: 60000000
  termination_enabled: true
  bit_timing:
    arbitration: { tseg1: 14, tseg2: 3, sjw: 2, brp: 5 }
    data_phase:  { tseg1: 10, tseg2: 2, sjw: 2, brp: 1 }

joints:                  # map hardware device name to controller joint key
  - device: THUMB
    key: thumb_mcp
  - device: INDEX_FINGER
    key: index_finger_mcp
  - device: MIDDLE_FINGER
    key: middle_finger_mcp
  - device: RING_FINGER
    key: ring_finger_mcp
  - device: PINKY_FINGER
    key: pinky_mcp

hold_targets:            # default target angles after calibration
  others_rad: 1.5707963  # 90°
  thumb_rad:  2.4434610  # 140°

calibration:
  current_limit_mA: 1500
  backdrive_speed: -200
  encoder_zero_offset: -10000

native_policy:
  pid: { kp: 0.005, ki: 0.00005, kd: 0.0001 }
  current_limits_mA: { min: -1000, max: 1000 }
  initial_theta_rad: 0.74918
  geometry:
    tendon_fix_mm:  9.410
    tendon_port_mm: 9.413
    coupling_ratio: 1
  screw_drive:
    pitch_mm_per_rev: 1.0
    counts_per_rev:   262144
  joint_tables:
    thumb_mcp:
      linear_zero_counts: 500
      feedforward_mA: [0,100,200,300,400,500,600,700,800,900,1000,1100,1200,1300,1400]
    index_finger_mcp:
      linear_zero_counts: 1000000
      feedforward_mA: [0,21.4286,42.8571,64.2857,85.7143,107.1429,128.5714,150.0,171.4286,192.8571,214.2857,235.7143,257.1429,278.5714,300.0]
    middle_finger_mcp:
      linear_zero_counts: 1000000
      feedforward_mA: [0,21.4286,42.8571,64.2857,85.7143,107.1429,128.5714,150.0,171.4286,192.8571,214.2857,235.7143,257.1429,278.5714,300.0]
    ring_finger_mcp:
      linear_zero_counts: 1000000
      feedforward_mA: [0,21.4286,42.8571,64.2857,85.7143,107.1429,128.5714,150.0,171.4286,192.8571,214.2857,235.7143,257.1429,278.5714,300.0]
    pinky_mcp:
      linear_zero_counts: 1000000
      feedforward_mA: [0,21.4286,42.8571,64.2857,85.7143,107.1429,128.5714,150.0,171.4286,192.8571,214.2857,235.7143,257.1429,278.5714,300.0]

python_policy:
  script_dir: "./"      # folder with Hall_Position_Control_with_Protection.py
  module: "Hall_Position_Control_with_Protection"
  class: "Hall_Position_Control_with_Protection_Function"
  use_headless_matplotlib: true
