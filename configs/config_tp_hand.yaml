control_policy: 
  - "zero_torque"
  # - "current"
  - "hall_position"
  - "joint_position"
  - "MIT_torque"
  # - "impedance"
wrist_control_policy: 
  - "zero_torque"
  - "joint_position"

urdf_file: "robots/model3_description_2/model3_urdf.urdf"
