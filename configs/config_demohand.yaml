      - pitch
      - yaw
    route: [{max: 50, min: -30}, {max: 21, min: -21}]
    motors: [{id: 1, param: [0, 0]}, {id: 2, param: [0, 0]}]
  PINKY:
    joints:
      - pinky
    route: [{max: 150, min: 0}]
    motors: [{id: 3, param: [1]}]
  RING_FINGER:
    joints:
      - ring
    route: [{max: 150, min: 0}]
    motors: [{id: 6, param: [1]}]
  MIDDLE_FINGER:
