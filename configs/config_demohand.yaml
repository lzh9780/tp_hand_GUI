type: hand

hardware_version: 0
software_version: 0

hand_struct:
  WRIST:
    dofs:
      - pitch
      - yaw
    route: [{max: 50, min: -30}, {max: 21, min: -21}]
    motors: [1, 2]
  PINKY:
    dofs:
      - pinky
    route: [{max: 150, min: 0}]
    joints:
      - pinky_mcp
      - pinky_pip
      - pinky_dip
    motors: [3]
  RING_FINGER:
    dofs:
      - ring
    route: [{max: 150, min: 0}]
    joints:
      - ring_mcp
      - ring_pip
      - ring_dip
    motors: [6]
  MIDDLE_FINGER:
    dofs:
      - middle
    route: [{max: 150, min: 0}]
    joints:
      - middle_mcp
      - middle_pip
      - middle_dip
    motors: [4]
  INDEX_FINGER:
    dofs:
      - index
    route: [{max: 150, min: 0}]
    joints:
      - index_mcp
      - index_pip
      - index_dip
    motors: [7]
  THUMB:
    dofs:
      - thumb
    route: [{max: 150, min: 0}]
    joints:
      - thumb_mcp
      - thumb_ip
    motors: [5]

control_policy: ["hall_protect", "cascaded_pid"]
wrist_control_policy: ["default", "soft"]

urdf_file: "Demo_urdf_v1.urdf"
