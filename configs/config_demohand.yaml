type: hand

hardware_version: 0
software_version: 0

hand_struct:
  WRIST:
    active_dofs:
      - pitch
      - yaw
    joints:
      - pitch
      - yaw
    dof_joint_map: [[1, 0], [0, 1]]
    route: [{max: 50, min: -30}, {max: 21, min: -21}]
    ids: [1, 2]
  PINKY:
    active_dofs:
      - pinky
    route: [{max: 150, min: 0}]
    joints:
      - pinky_mcp
      - pinky_pip
      - pinky_dip
    dof_joint_map: [[1, 1, 1]]
    ids: [3]
  RING_FINGER:
    active_dofs:
      - ring
    route: [{max: 150, min: 0}]
    joints:
      - ring_mcp
      - ring_pip
      - ring_dip
    dof_joint_map: [[1, 1, 1]]
    ids: [6]
  MIDDLE_FINGER:
    active_dofs:
      - middle
    route: [{max: 150, min: 0}]
    joints:
      - middle_mcp
      - middle_pip
      - middle_dip
    dof_joint_map: [[1, 1, 1]]
    ids: [4]
  INDEX_FINGER:
    active_dofs:
      - index
    route: [{max: 150, min: 0}]
    joints:
      - index_mcp
      - index_pip
      - index_dip
    dof_joint_map: [[1, 1, 1]]
    ids: [7]
  THUMB:
    active_dofs:
      - thumb
    route: [{max: 150, min: 0}]
    joints:
      - thumb_cmc
      - thumb_mcp
      - thumb_ip
    dof_joint_map: [[1, 1, 1]]
    ids: [5]

control_policy: ["hall_protect", "cascaded_pid"]
wrist_control_policy: ["default", "soft"]

urdf_file: "robots/demohand/urdf/Demo_urdf_v1.urdf"
